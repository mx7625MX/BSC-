<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSC MEME币阻击机器人 - 控制面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .status-running {
            background: #10b981;
            color: white;
        }

        .status-stopped {
            background: #ef4444;
            color: white;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .stat:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
            font-weight: 600;
        }

        .stat-value {
            color: #333;
            font-weight: bold;
        }

        .holdings-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .holdings-table th,
        .holdings-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .holdings-table th {
            background: #f3f4f6;
            color: #667eea;
            font-weight: 600;
        }

        .holdings-table tr:hover {
            background: #f9fafb;
        }

        .log-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-height: 400px;
            overflow-y: auto;
        }

        .log-container h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .log-entry {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            padding: 5px;
            border-bottom: 1px solid #f0f0f0;
            color: #555;
        }

        .log-entry:hover {
            background: #f9fafb;
        }

        .feature-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .feature-enabled {
            background: #10b981;
        }

        .feature-disabled {
            background: #ef4444;
        }

        .refresh-info {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 20px;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 30px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 BSC MEME币阻击机器人控制面板</h1>
            <span id="status-badge" class="status-badge status-stopped">已停止</span>
        </header>

        <div class="dashboard">
            <div class="card">
                <h2>📊 基本信息</h2>
                <div class="stat">
                    <span class="stat-label">钱包地址</span>
                    <span class="stat-value" id="account-address">加载中...</span>
                </div>
                <div class="stat">
                    <span class="stat-label">账户余额</span>
                    <span class="stat-value" id="account-balance">0 BNB</span>
                </div>
                <div class="stat">
                    <span class="stat-label">已监控交易对</span>
                    <span class="stat-value" id="processed-pairs">0</span>
                </div>
            </div>

            <div class="card">
                <h2>⚙️ 功能状态</h2>
                <div class="stat">
                    <span class="stat-label">
                        <span class="feature-indicator" id="auto-trade-indicator"></span>
                        自动交易
                    </span>
                    <span class="stat-value" id="auto-trade-status">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">
                        <span class="feature-indicator" id="profit-taking-indicator"></span>
                        止盈止损
                    </span>
                    <span class="stat-value" id="profit-taking-status">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">
                        <span class="feature-indicator" id="quick-sell-indicator"></span>
                        快速卖出
                    </span>
                    <span class="stat-value" id="quick-sell-status">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">
                        <span class="feature-indicator" id="copy-trade-indicator"></span>
                        钱包跟单
                    </span>
                    <span class="stat-value" id="copy-trade-status">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">
                        <span class="feature-indicator" id="buy-volume-indicator"></span>
                        买入量触发
                    </span>
                    <span class="stat-value" id="buy-volume-status">-</span>
                </div>
            </div>

            <div class="card">
                <h2>💰 交易配置</h2>
                <div class="stat">
                    <span class="stat-label">最大购买金额</span>
                    <span class="stat-value" id="max-buy-amount">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">最小流动性</span>
                    <span class="stat-value" id="min-liquidity">-</span>
                </div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 20px;">
            <h2>💼 当前持仓</h2>
            <div id="holdings-content">
                <div class="empty-state">暂无持仓</div>
            </div>
        </div>

        <div class="log-container">
            <h2>📝 实时日志</h2>
            <div id="logs">
                <div class="log-entry">等待日志...</div>
            </div>
        </div>

        <div class="refresh-info">
            ⏱️ 数据每5秒自动刷新 | 使用WebSocket实时更新
        </div>
    </div>

    <script>
        let ws;
        const logsContainer = document.getElementById('logs');
        const maxLogs = 50;

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                console.log('WebSocket连接已建立');
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                
                if (message.type === 'status') {
                    updateStatus(message.data);
                } else if (message.type === 'log') {
                    addLog(message.data);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket错误:', error);
            };

            ws.onclose = () => {
                console.log('WebSocket连接已关闭，5秒后重连...');
                setTimeout(connectWebSocket, 5000);
            };
        }

        function updateStatus(status) {
            // 更新状态徽章
            const statusBadge = document.getElementById('status-badge');
            if (status.isRunning) {
                statusBadge.textContent = '运行中';
                statusBadge.className = 'status-badge status-running';
            } else {
                statusBadge.textContent = '已停止';
                statusBadge.className = 'status-badge status-stopped';
            }

            // 更新基本信息
            document.getElementById('account-address').textContent = 
                status.accountAddress ? `${status.accountAddress.substring(0, 10)}...` : '-';
            document.getElementById('account-balance').textContent = 
                `${parseFloat(status.accountBalance).toFixed(4)} BNB`;
            document.getElementById('processed-pairs').textContent = status.processedPairs;

            // 更新功能状态
            updateFeatureStatus('auto-trade', status.config.autoTradeEnabled);
            updateFeatureStatus('profit-taking', status.config.takeProfitEnabled);
            updateFeatureStatus('quick-sell', status.config.quickSellEnabled);
            updateFeatureStatus('copy-trade', status.config.copyTradeEnabled);
            updateFeatureStatus('buy-volume', status.config.sellOnBuyVolumeEnabled);

            // 更新交易配置
            document.getElementById('max-buy-amount').textContent = 
                `${status.config.maxBuyAmount} BNB`;
            document.getElementById('min-liquidity').textContent = 
                `${status.config.minLiquidityBnb} BNB`;

            // 更新持仓
            updateHoldings(status.holdings);
        }

        function updateFeatureStatus(featureName, enabled) {
            const indicator = document.getElementById(`${featureName}-indicator`);
            const statusText = document.getElementById(`${featureName}-status`);
            
            if (enabled) {
                indicator.className = 'feature-indicator feature-enabled';
                statusText.textContent = '已启用';
            } else {
                indicator.className = 'feature-indicator feature-disabled';
                statusText.textContent = '未启用';
            }
        }

        function updateHoldings(holdings) {
            const container = document.getElementById('holdings-content');
            
            if (!holdings || holdings.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无持仓</div>';
                return;
            }

            let tableHTML = `
                <table class="holdings-table">
                    <thead>
                        <tr>
                            <th>代币地址</th>
                            <th>数量</th>
                            <th>买入价格</th>
                            <th>购买时间</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            holdings.forEach(holding => {
                const date = new Date(holding.buyTimestamp).toLocaleString('zh-CN');
                const tokenShort = holding.tokenAddress.substring(0, 10) + '...';
                tableHTML += `
                    <tr>
                        <td><code>${tokenShort}</code></td>
                        <td>${parseFloat(holding.amount).toFixed(4)}</td>
                        <td>${holding.buyPrice}</td>
                        <td>${date}</td>
                    </tr>
                `;
            });

            tableHTML += '</tbody></table>';
            container.innerHTML = tableHTML;
        }

        function addLog(logText) {
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.textContent = logText;
            
            logsContainer.insertBefore(logEntry, logsContainer.firstChild);
            
            // 限制日志数量
            while (logsContainer.children.length > maxLogs) {
                logsContainer.removeChild(logsContainer.lastChild);
            }
        }

        // 页面加载时连接WebSocket
        connectWebSocket();

        // 定期拉取状态作为备份
        setInterval(async () => {
            try {
                const response = await fetch('/api/status');
                const status = await response.json();
                updateStatus(status);
            } catch (error) {
                console.error('获取状态失败:', error);
            }
        }, 10000);
    </script>
</body>
</html>
